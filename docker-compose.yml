services:
  mlflow:
    build: .
    command: >-
      mlflow server
      --backend-store-uri sqlite:////mlflow-data/mlflow.db
      --artifacts-destination /mlflow-data/mlartifacts
      --host 0.0.0.0
      --port 5000
      --allowed-hosts localhost,localhost:5000,127.0.0.1,127.0.0.1:5000,mlflow,mlflow:5000
    ports:
      - "5000:5000"
    volumes:
      - mlflow-data:/mlflow-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 5s
      timeout: 5s
      retries: 20

  # One-shot: ingest data, train both models, register the LightGBM forecaster as
  # "champion", then run the drift report. Runs once per `docker compose up` and
  # exits; the api service waits for it to finish before starting. drift_report's
  # own exit code is swallowed with `|| true`: it exits 1 when it *correctly finds*
  # drift, which is a monitoring result, not a training failure -- letting that fail
  # the container would block api from ever starting on a perfectly good model.
  trainer:
    build: .
    command: >-
      sh -c "
      python -m epicast.ingest.fetch_ilinet &&
      python -m epicast.train.prophet_baseline &&
      python -m epicast.train.lightgbm_model --register &&
      (python -m epicast.monitor.drift_report || true)
      "
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - epicast-data:/app/data
      - ./reports:/app/reports
    depends_on:
      mlflow:
        condition: service_healthy

  api:
    build: .
    command: uvicorn epicast.serve.app:app --host 0.0.0.0 --port 8000
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      # Host 8000 collides with a Windows/Hyper-V dynamic port reservation on some
      # machines; 8080 avoids it. Container-internal port is unaffected either way.
      - "8080:8000"
    volumes:
      - epicast-data:/app/data
    depends_on:
      trainer:
        condition: service_completed_successfully

volumes:
  mlflow-data:
  epicast-data:
