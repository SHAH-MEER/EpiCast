[project]
name = "epicast"
version = "0.1.0"
description = "Real-time ILI forecasting API: train, track, serve, ship, monitor."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
    "pandas>=2.2",
    "epiweeks>=2.3",
    "prophet>=1.1.5",
    "mlflow>=2.14",
    "lightgbm>=4.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
